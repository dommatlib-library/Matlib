<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MatLib | Books</title>

  <!-- Supabase must load before config.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="assets/books.css" />
</head>

<body>

  <main class="books-page">

    <!-- Header -->
    <section class="books-header">
      <div>
        <p class="eyebrow">MATLIB LIBRARY</p>

        <h1>Library Collection</h1>

        <p class="books-count" id="booksCount">
          Loading books...
        </p>
      </div>

      <div class="live-status">
        <span></span>
        Live Catalogue
      </div>
    </section>

    <!-- Filters -->
    <section class="filters-panel">

      <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
          type="text"
          id="searchInput"
          placeholder="Search book name, author, access no..."
        />

        <button
          type="button"
          id="clearSearch"
          class="clear-search"
          aria-label="Clear search"
        >
          ×
        </button>
      </div>

      <select id="availabilityFilter">
        <option value="all">All Books</option>
        <option value="available">Available</option>
        <option value="issued">Issued</option>
      </select>

      <select id="sortSelect">
        <option value="id-asc">Sort by ID</option>
        <option value="id-desc">ID: High to Low</option>
        <option value="name-asc">Book Name: A-Z</option>
        <option value="name-desc">Book Name: Z-A</option>
        <option value="author-asc">Author: A-Z</option>
      </select>

      <button
        type="button"
        id="clearFilters"
        class="clear-filters"
      >
        Clear Filters
      </button>

    </section>

    <!-- Catalogue heading -->
    <section class="catalogue-heading">
      <div>
        <h2>Books</h2>

        <p id="matchingCount">
          Loading...
        </p>
      </div>
    </section>

    <!-- Books -->
    <section
      id="booksGrid"
      class="books-grid"
      aria-live="polite"
    ></section>

    <!-- Loading -->
    <div
      id="loadingState"
      class="loading-state"
    >
      Loading books...
    </div>

    <!-- Empty -->
    <div
      id="emptyState"
      class="empty-state hidden"
    >
      <div class="empty-icon">📚</div>
      <h3>No books found</h3>
      <p>Try changing your search or filters.</p>
    </div>

    <!-- Pagination -->
    <nav
      id="pagination"
      class="pagination"
      aria-label="Book pages"
    ></nav>

  </main>

  <!-- Request modal -->
  <div
    id="requestModal"
    class="modal-overlay hidden"
    aria-hidden="true"
  >
    <div
      class="request-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="requestTitle"
    >

      <button
        type="button"
        id="closeModal"
        class="modal-close"
        aria-label="Close request modal"
      >
        ×
      </button>

      <div class="modal-icon">📩</div>

      <p class="modal-eyebrow">BOOK REQUEST</p>

      <h2 id="requestTitle">
        Request Book
      </h2>

      <h3 id="requestBookName">
        Book name
      </h3>

      <label for="requestMessage">
        Message
      </label>

      <textarea
        id="requestMessage"
        rows="4"
        placeholder="Write your request message..."
      ></textarea>

      <div class="modal-actions">
        <button
          type="button"
          id="cancelRequest"
          class="cancel-button"
        >
          Cancel
        </button>

        <button
          type="button"
          id="sendRequest"
          class="send-button"
        >
          📩 Send Request
        </button>
      </div>

      <p
        id="requestError"
        class="request-error hidden"
      ></p>

    </div>
  </div>

  <!-- Supabase configuration -->
  <script src="assets/config.js"></script>

  <!-- Books logic -->
  <script src="assets/books.js"></script>

</body>
</html>
